<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Next Chat</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <!-- LOGIN SCREEN -->
        <div id="login-screen" class="login-screen">
            <div class="login-bg">
                <div class="grid-overlay"></div>
                <div class="glow-blob blob-1"></div>
                <div class="glow-blob blob-2"></div>
            </div>
            <div class="login-card">
                <div class="login-logo">
                    <span class="logo-icon">⬡</span>
                    <span class="logo-name">NEXT</span>
                </div>

                <p class="login-subtitle">Masukkan tanda panggilan Anda untuk terhubung</p>

                <div class="input-group">
                    <input 
                        type="text" 
                        id="username-input" 
                        class="text-input" 
                        placeholder="NAMA_KAMU" 
                        maxlength="20" 
                        autocomplete="off" 
                    />
                    <div class="input-underline"></div>
                </div>

                <div class="input-group" style="margin-top: 12px">
                    <input
                        type="text"
                        id="room-input"
                        class="text-input"
                        placeholder="KODE_ROOM (optional)"
                        maxlength="20"
                        autocomplete="off"
                    />
                    <div class="input-underline"></div>
                </div>

                <button id="join-btn" class="btn-primary">
                    <span class="btn-text">Connect</span>
                    <span class="btn-arrow">-></span>
                </button>

                <p class="login-hint">Tidak diperlukan akun. Hanya sebuah nama.</p>
            </div>
        </div>

        <!-- CHAT SCREEN -->
        <div id="chat-screen" class="screen">
            <aside class="sidebar">
                <div class="sidebar-header">
                    <div class="sidebar-logo">
                        <span class="logo-icon">⬡</span>
                        <span class="logo-text">NEXT</span>
                    </div>
                </div>

                <div class="room-section">
                    <div class="section-label">RUANGAN</div>
                    <ul id="room-list" class="room-list"></ul>
                    <div class="new-room-row">
                        <input
                            type="text"
                            id="new-room-input"
                            class="small-input"
                            placeholder="room baru..."
                            maxlength="20"
                        />
                        <button id="create-room-btn" class="icon-btn" title="Create room">
                            +
                        </button>
                    </div>
                </div>

                <div class="online-screen">
                    <div class="section-label">
                        ONLINE - <span id="online-count">0</span>
                    </div>
                    <ul id="online-list" class="online-list"></ul>
                </div>

                <div class="sidebar-footer">
                    <div class="my-avatar" id="my-avatar"></div>
                    <div class="my-info">
                        <span class="my-name" id="my-name-display"></span>
                        <span class="my-status">● Online</span>
                    </div>
                    <button id="logout-btn" class="logout-btn" title="Disconnect">
                        ⏻
                    </button>
                </div>
            </aside>

            <main class="chat-main">
                <header class="chat-header">
                    <div class="chat-room-info">
                        <span class="room-hash">#</span>
                        <span class="room-name" id="current-room-name">general</span>
                    </div>
                    <div class="header-actions">
                        <button class="header-btn" id="clear-btn" title="Clear messages">
                            Clear
                        </button>
                        <button class="header-btn mobile-only" id="sidebar-toggle" title="Toggle sidebar">
                            ☰
                        </button>
                    </div>
                </header>

                <div id="messages-container" class="messages-container">
                    <div class="messages-list" id="messages-list"></div>
                    <div class="typing-indicator hidden" id="typing-indicator">
                        <span class="typing-dots">
                            <span></span><span></span><span></span>
                        </span>
                        <span class="typing-text" id="typing-text"></span>
                    </div>
                </div>

                <footer class="chat-footer">
                    <div class="message-input-wrap">
                        <button id="emoji-btn" class="emoji-toggle-btn" title="Emoji">
                            😊
                        </button>
                        <div id="emoji-picker" class="emoji-picker hidden"></div>
                        <textarea
                            id="message-input"
                            class="message-textarea"
                            placeholder="Message #general..."
                            rows="1"
                            maxlength="1000">
                        </textarea>
                        <button id="send-btn" class="send-btn" title="Send">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </div>
                    <div class="footer-meta">
                        <span id="char-count" class="char-count">0 / 1000</span>
                        <span class="footer-hint">
                            Enter to send · Shift+Enter for new line
                        </span>
                    </div>
                </footer>
            </main>
        </div>

        <!-- NOTIFICATION -->
        <div id="toast" class="toast hidden"></div>

        <!-- SCRIPT -->
        <script src="js/app.js"></script>
        <script src="js/storage.js"></script>
        <script src="js/emojis.js"></script>
        <script src="js/chat.js"></script>
    </body>
</html>
